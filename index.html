<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Employee Management System</title>
    </head>
    <body>
      
        <main class="container">
            <header>
                <h1>Employee Management System</h1>
                <p>Manage employees and departments</p>
            </header>

            <section class="form-section">
                <h2 id="formTitle">Add Employee</h2>

                <form id="employeeForm">
                    <input type="hidden" id="employeeId" />

                    <label for="name">Employee Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter employee name"
                    />

                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter email" />

                    <label for="department">Department</label>
                    <select id="department">
                        <option value="">Select department</option>
                    </select>

                    <label for="role">Job Role</label>
                    <input type="text" id="role" placeholder="Enter job role" />

                    <label for="joiningDate">Joining Date</label>
                    <input type="date" id="joiningDate" />

                    <button type="submit" id="submitButton">
                        Add Employee
                    </button>

                    <button type="button" id="cancelButton" hidden>
                        Cancel Editing
                    </button>
                </form>

                <p id="message" role="status"></p>
            </section>

            <section class="employee-section">
                <h2>Employee Directory</h2>

                <div class="filters">
                    <input
                        type="search"
                        id="searchName"
                        placeholder="Search by employee name"
                    />

                    <select id="searchDepartment">
                        <option value="">All Departments</option>
                    </select>
                </div>

                <div id="employeeList"></div>
            </section>

            <section class="report-section">
                <h2>Optional Reports</h2>
                <button type="button" id="reportButton">
                    Generate Department Report
                </button>
                <pre id="reportOutput"></pre>
            </section>
        </main>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
